services:
  - type: web
    name: vodalease-enterprise
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@9.6.0 && pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false
      - key: MSSQL_HOST
        sync: false
      - key: MSSQL_PORT
        value: "1433"
      - key: MSSQL_DATABASE
        sync: false
      - key: MSSQL_USER
        sync: false
      - key: MSSQL_PASSWORD
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        value: 2024-12-01-preview
      - key: JWT_SECRET
        sync: false
